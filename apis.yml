aid: density
name: Density
description: 'Density builds radar-based occupancy sensors and a workplace analytics platform that measures
  how people use physical space without cameras or personally identifiable information. Its v3 Public API
  (api.density.io) exposes real-time occupancy and presence, historical metrics (occupancy, utilization,
  time used, sessions, raw sessions), spaces / doorways / sensors / labels resources, sensor and space
  health, wayfinding display tokens, and WebSocket streams for live floor presence and space occupancy.
  Authentication is OAuth 2.0 client-credentials (Auth0-backed) or static Bearer API tokens. Originally
  surfaced as a portfolio company of kleiner-perkins and enriched from Density''s public developer surface.'
