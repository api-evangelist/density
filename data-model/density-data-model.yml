entities:
- name: Space
  description: A physical area (building, floor, room, or open area) that is measured.
  key_fields: [id, name, space_type]
- name: Doorway
  description: An entry/exit point associated with a space, monitored by Entry sensors.
  key_fields: [id, name]
- name: Sensor
  description: A Density device (Open Area / Entry / Waffle) that produces counts and presence.
  key_fields: [id, sensor_type, health]
- name: Label
  description: A tag applied to spaces; labels are organized into label groups.
  key_fields: [id, name]
- name: LabelGroup
  description: A collection of labels.
  key_fields: [id, name]
- name: User
  description: An account user (managed via M2M endpoints).
  key_fields: [id, email, role]
relationships:
